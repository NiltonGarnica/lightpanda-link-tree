services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      LIGHTPANDA_WS_URL: ws://lightpanda:9222/
      LIGHTPANDA_HTTP_URL: http://lightpanda:9222
    depends_on:
      - lightpanda
    restart: unless-stopped

  lightpanda:
    image: lightpanda/browser:latest
    command:
      - /bin/lightpanda
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "9222"
      - --advertise-host
      - lightpanda
      - --log_level
      - info
    environment:
      LIGHTPANDA_DISABLE_TELEMETRY: "true"
    restart: unless-stopped
